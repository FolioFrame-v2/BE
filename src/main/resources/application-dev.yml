spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DATABASE}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  token:
    secret-key: ${JWT_TOKEN_SECRET_KEY}
    expiration:
      access: 3600000    # 1시간 (밀리초 단위)
      refresh: 604800000 # 7일 (밀리초 단위)